services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [storage]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U harness -d harness']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    command: [node, --experimental-strip-types, packages/storage/migrate.ts]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
    networks: [storage]
    depends_on:
      postgres: {condition: service_healthy}
  core:
    build: .
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      ENGINE_TOKEN_FILE: /run/secrets/engine_token
      OWNER_TOKEN_FILE: /run/secrets/owner_token
      AUDIO_TOKEN_FILE: /run/secrets/audio_token
      BRIDGE_TOKEN_FILE: /run/secrets/bridge_token
      BRIDGE_CLIENT_WORLD_ENABLED: ${BRIDGE_CLIENT_WORLD_ENABLED:-false}
      CHARACTER_ID: sever
      AUDIENCE_ID: demo-public
      BRIDGE_SYSTEM_CHAT_PUBLIC_DEMO: ${BRIDGE_SYSTEM_CHAT_PUBLIC_DEMO:-false}
    secrets: [database_url, engine_token, owner_token, audio_token, bridge_token]
    networks: [storage, agent]
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      migrate: {condition: service_completed_successfully}
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:3000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  engine:
    build: .
    command: [node, --experimental-strip-types, apps/engine/main.ts]
    profiles: [agent]
    environment:
      CORE_URL: http://core:3000
      ENGINE_TOKEN_FILE: /run/secrets/engine_token
      MODEL_API_KEY_FILE: /run/secrets/model_api_key
      PI_PROVIDER: ${PI_PROVIDER:-}
      PI_MODEL: ${PI_MODEL:-}
    secrets: [engine_token, model_api_key]
    volumes: [engine_data:/data]
    networks: [agent]
    depends_on:
      core: {condition: service_healthy}
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  codex-engine:
    build: .
    command: [node, --experimental-strip-types, apps/codex-engine/main.ts]
    profiles: [codex]
    environment:
      CORE_URL: http://core:3000
      ENGINE_TOKEN_FILE: /run/secrets/engine_token
      HARNESS_CODEX_HOME: /data/codex
      CODEX_MODEL: ${CODEX_MODEL:-gpt-6-luna}
    secrets: [engine_token]
    volumes: [codex_data:/data]
    networks: [agent]
    depends_on:
      core: {condition: service_healthy}
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
  tts:
    build:
      context: .
      dockerfile: Dockerfile.tts
    profiles: [tts]
    environment:
      TTS_TOKEN_FILE: /run/secrets/tts_token
      PIPER_MODEL: /models/ru_RU-dmitri-medium.onnx
      TTS_HOST: 0.0.0.0
      TTS_PORT: 3081
    secrets: [tts_token]
    volumes:
      - ${PIPER_MODEL_DIR:-./work/tts-models}:/models:ro
    networks: [tts_internal]
    ports: ['127.0.0.1:3081:3081']
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 2.0
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:3081/ready", timeout=1).read()']
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped
  stt:
    build:
      context: .
      dockerfile: Dockerfile.stt
    profiles: [stt]
    environment:
      STT_TOKEN_FILE: /run/secrets/stt_token
      STT_MODEL_DIR: /models
      STT_HOST: 0.0.0.0
      STT_PORT: 3082
      STT_CPU_THREADS: ${STT_CPU_THREADS:-4}
    secrets: [stt_token]
    volumes:
      - ${STT_MODEL_DIR:-./work/stt-models}:/models:ro
    networks: [stt_internal]
    ports: ['127.0.0.1:3082:3082']
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Measured peak is 576 MiB under the worst case the service accepts (an 8 s request under
    # concurrent load); see docs/reviews/stt-model-selection.md.
    mem_limit: 2g
    cpus: 4.0
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:3082/ready", timeout=1).read()']
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped
networks:
  storage: {internal: true}
  agent: {}
  tts_internal: {}
  stt_internal: {}
volumes:
  postgres_data:
  engine_data:
  codex_data:
secrets:
  db_password: {file: ./secrets/db_password}
  database_url: {file: ./secrets/database_url}
  engine_token: {file: ./secrets/engine_token}
  owner_token: {file: ./secrets/owner_token}
  model_api_key: {file: ./secrets/model_api_key}
  audio_token: {file: ./secrets/audio_token}
  bridge_token: {file: ./secrets/bridge_token}
  tts_token: {file: ./secrets/tts_token}
  stt_token: {file: ./secrets/stt_token}
